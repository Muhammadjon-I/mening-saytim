<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E'lonlar</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2430; --muted:#6b7686; --line:#e3e7ee; --accent:#1d6fd8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1b212a; --text:#e8ecf2; --muted:#93a0b2; --line:#2a323d; --accent:#5aa2ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 24px; }
  .post { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:16px; }
  .post img { display:block; width:100%; max-height:420px; object-fit:cover; }
  .post .body { padding:14px 16px; }
  .post p { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
  .post time { display:block; margin-top:8px; font-size:.85rem; color:var(--muted); }
  .state { color:var(--muted); text-align:center; padding:32px 0; }
</style>
</head>
<body>
<main>
  <h1>E'lonlar</h1>
  <div id="list"><div class="state">Yuklanmoqda…</div></div>
</main>
<script>
  // Faqat ANON kalit shu yerga qo'yiladi (service_role emas!)
  const SUPABASE_URL = "https://zteykysnllytgoogbnvo.supabase.co";
const ANON_KEY = "sb_publishable_ExR5_Fs_JjN-UIP-cb71eQ_wTE94Li_";

  const list = document.getElementById("list");

  function render(posts) {
    list.innerHTML = "";
    if (!posts.length) {
      list.innerHTML = '<div class="state">Hozircha e\'lon yo\'q. Botga yozing, shu yerda paydo bo\'ladi.</div>';
      return;
    }
    for (const p of posts) {
      const card = document.createElement("article");
      card.className = "post";
      if (p.image_url) {
        const img = document.createElement("img");
        img.src = p.image_url;
        img.alt = "";
        img.loading = "lazy";
        card.appendChild(img);
      }
      const body = document.createElement("div");
      body.className = "body";
      if (p.text) {
        const t = document.createElement("p");
        t.textContent = p.text;
        body.appendChild(t);
      }
      const time = document.createElement("time");
      time.textContent = new Date(p.created_at).toLocaleString("uz-UZ");
      body.appendChild(time);
      card.appendChild(body);
      list.appendChild(card);
    }
  }

  fetch(SUPABASE_URL + "/rest/v1/posts?select=*&order=created_at.desc", {
    headers: { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY }
  })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(render)
    .catch(() => { list.innerHTML = '<div class="state">Ma\'lumotni yuklab bo\'lmadi. URL va anon kalitni tekshiring.</div>'; });
</script>
</body>
</html>
